<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Jodnoi - จดหน่อย</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: radial-gradient(130% 90% at 50% 30%, #ffffff 0%, #ffffff 38%, #f4f1ff 78%, #ebe5fd 100%);
        font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #2a2147;
      }
      .boot img {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        box-shadow: 0 18px 44px -14px rgba(74, 58, 120, 0.5);
        animation: boot-bob 1.8s ease-in-out infinite;
      }
      .boot-name {
        margin: 14px 0 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .boot-tag {
        margin: 0;
        font-size: 14px;
        color: #7a71a3;
      }
      .boot-bar {
        width: 72px;
        height: 4px;
        margin-top: 18px;
        border-radius: 99px;
        background: #ddd5fb;
        overflow: hidden;
      }
      .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: #4a3a78;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-bob {
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot img,
        .boot-bar i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="กำลังโหลด Jodnoi">
        <img src="/icon-any.svg" alt="" width="112" height="112" />
        <p class="boot-name">Jodnoi</p>
        <p class="boot-tag">จดหน่อย ก่อนลืม</p>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
